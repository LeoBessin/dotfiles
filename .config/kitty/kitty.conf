## name: QuickShell Bar
## blurb: Matches ~/.config/quickshell/bar/modules/Theme.qml
##
## Every value below is derived from Theme.qml. If you change the bar palette,
## change it here too. Previous Rosé Pine config: kitty.conf.rose-pine.bak
##
## The window outline (1px #b39ddb @ 25%) and the 10px corner radius are NOT
## set here — kitty cannot draw either. They live in the compositor:
##   niri:     ~/.config/niri/window-rules.kdl  (app-id "^kitty$")
##   hyprland: ~/.config/hypr/lua/windowrules.lua

# ── Background ───────────────────────────────────────────────────────────────
# Theme.bg = Qt.rgba(0.10, 0.10, 0.18, 0.55) → #1a1a2e at 55%.
# Only the background is translucent; text stays fully opaque, exactly like the
# bar. The blur behind it comes from the compositor's background-effect rule.
background               #1a1a2e
background_opacity       0.55

# Theme.fg
foreground               #e0e0f0

# Theme.notifCardBg = Qt.rgba(0.18, 0.16, 0.30, …)
selection_foreground     #e0e0f0
selection_background     #2e294c

# Theme.accent
cursor                   #b39ddb
cursor_text_color        #1a1a2e
url_color                #b39ddb

# ── Tabs ─────────────────────────────────────────────────────────────────────
active_tab_foreground    #e0e0f0
active_tab_background    #2e294c
inactive_tab_foreground  #9090b0
inactive_tab_background  #1a1a2e

# ── Split borders ────────────────────────────────────────────────────────────
# Theme.accent for the focused split; kitty does not accept alpha here, so the
# unfocused one is the bar border flattened onto the bar background.
active_border_color      #b39ddb
inactive_border_color    #3a3a52

# ── ANSI palette ─────────────────────────────────────────────────────────────
# Theme.qml defines 8 of these. Blue and cyan have no bar equivalent, so they
# are the Material 200 shades that the rest of the palette already comes from.

# black — Theme.bgSolid / Theme.fgDim
color0   #1a1a2e
color8   #9090b0

# red — Theme.red
color1   #ef9a9a
color9   #ef9a9a

# green — Theme.green
color2   #a5d6a7
color10  #a5d6a7

# yellow — Theme.yellow
color3   #fff176
color11  #fff176

# blue — Material Blue 200 (no bar equivalent)
color4   #90caf9
color12  #90caf9

# magenta — Theme.accent / Theme.accentDim
color5   #b39ddb
color13  #7e57c2

# cyan — Material Cyan 200 (no bar equivalent)
color6   #80deea
color14  #80deea

# white — Theme.fg
color7   #e0e0f0
color15  #e0e0f0

# ── Typography ───────────────────────────────────────────────────────────────
# Theme.monoFamily = "JetBrains Mono"; the Nerd Font build is the same face
# plus glyph coverage, which the bar's nerdFamily also uses.
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        10.0

# Theme.widgetPad
window_padding_width 8

cursor_trail 1
